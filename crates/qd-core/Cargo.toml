[package]
name = "qd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "QUIC-based local file transfer core (protocol, discovery, transfer)"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14.10", features = ["pem"] }
mdns-sd = "0.21.6"
if-addrs = "0.15"
socket2 = "0.6.5"
postcard = { version = "1.1.3", features = ["use-std"] }
blake3 = "1.8.7"
dirs = "7.0.0"
hex = "0.4.3"
bytes = "1.12.1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
