name: Feature request
description: Propose a change in behaviour or a new capability.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today, and in which situation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen instead? Mention the CLI, daemon API or desktop UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other designs you weighed.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - qd CLI
        - quicdropd
        - Desktop app
        - Protocol
        - Discovery
        - Packaging
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and the README.
          required: true
