name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: check version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            echo "tag $tag is not v<YEAR>.<WEEK>.<PATCH>" >&2
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: add macos targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: build
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="quicdrop-${version}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "macOS" ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked -p qd -p qd-daemon --target "$target"
            done
            for bin in qd quicdropd; do
              lipo -create -output "dist/$name/$bin" \
                "target/aarch64-apple-darwin/release/$bin" \
                "target/x86_64-apple-darwin/release/$bin"
            done
            cp LICENSE-MIT README.md "dist/$name/"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cargo build --release --locked
            cp target/release/qd.exe target/release/quicdropd.exe LICENSE-MIT README.md "dist/$name/"
          else
            cargo build --release --locked
            cp target/release/qd target/release/quicdropd LICENSE-MIT README.md "dist/$name/"
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: check version
        shell: bash
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            echo "tag $tag is not v<YEAR>.<WEEK>.<PATCH>" >&2
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: install tauri cli
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - run: cargo binstall -y tauri-cli@^2
      - name: linux deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev patchelf libfuse2
      - name: macos targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: build linux
        if: runner.os == 'Linux'
        # The Linux bundles carry the CLI next to the app; macOS and Windows bundles do not.
        run: |
          ../../scripts/stage-sidecars.sh
          cargo tauri build --bundles deb,rpm,appimage \
            --config '{"bundle":{"externalBin":["binaries/qd","binaries/quicdropd"]}}'
      - name: build windows
        if: runner.os == 'Windows'
        shell: bash
        run: cargo tauri build --bundles nsis
      - name: build macos
        if: runner.os == 'macOS'
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg
      - name: collect
        shell: bash
        run: |
          out="$PWD/dist"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)
          mkdir -p "$out"
          if [ "$RUNNER_OS" = "macOS" ]; then
            base=target/universal-apple-darwin/release/bundle
          else
            base=target/release/bundle
          fi
          find "$base" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} "$out/" \;
          # Tauri names each bundle after its own convention; publish one scheme.
          for file in "$out"/*; do
            case "$(basename "$file")" in
              *.deb)       mv "$file" "$out/quicdrop-desktop-$version-amd64.deb" ;;
              *.rpm)       mv "$file" "$out/quicdrop-desktop-$version-x86_64.rpm" ;;
              *.AppImage)  mv "$file" "$out/quicdrop-desktop-$version-amd64.AppImage" ;;
              *.dmg)       mv "$file" "$out/quicdrop-desktop-$version-universal.dmg" ;;
              *-setup.exe) mv "$file" "$out/quicdrop-desktop-$version-x64-setup.exe" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: apps/desktop/dist/*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git rust gtk3 webkit2gtk-4.1 libsoup3 hicolor-icon-theme
      - uses: actions/checkout@v7
      - name: build package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "cd packaging/arch && makepkg -s --noconfirm"
      # Proves the recipe builds against the tag; the package itself ships via the AUR.

  publish:
    needs: [cli, desktop, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: check the published set
        run: |
          # This job only downloads artifacts, so the version comes from the tag.
          version="${GITHUB_REF_NAME#v}"
          cd dist
          # Fails the release when an expected asset is missing. The flatpak is
          # attached by its own workflow, so it is not listed here.
          for expected in \
            "quicdrop-$version-linux-x86_64.tar.gz" \
            "quicdrop-$version-windows-x86_64.tar.gz" \
            "quicdrop-$version-macos-universal.tar.gz" \
            "quicdrop-desktop-$version-amd64.deb" \
            "quicdrop-desktop-$version-x86_64.rpm" \
            "quicdrop-desktop-$version-amd64.AppImage" \
            "quicdrop-desktop-$version-x64-setup.exe" \
            "quicdrop-desktop-$version-universal.dmg"
          do
            if [ ! -f "$expected" ]; then
              echo "missing release asset: $expected" >&2
              ls -l >&2
              exit 1
            fi
          done
      - name: checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
