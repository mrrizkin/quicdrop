name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The release profile is what ships; building it here catches profile-only breakage.
      - run: cargo build --release --workspace
      # Flatpak builds offline from this list, so it has to match the desktop lockfile.
      - run: python3 scripts/check-flatpak-sources.py

  desktop:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path apps/desktop/Cargo.toml
