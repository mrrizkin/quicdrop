[package]
name = "quicdrop-desktop"
version = "2026.44.10"
edition = "2021"
license = "MIT"
description = "QuicDrop desktop app (Tauri shell around the quicdrop daemon)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qd-core = { path = "../../crates/qd-core" }
qd-daemon = { path = "../../crates/qd-daemon" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
